<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Échecs - Interface Joueur</title>
    <style>
        :root { --bg: #1e1e2e; --panel: #2a2a3c; --accent: #007bff; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; }
        
        .main-container { display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; justify-content: center; width: 95%; max-width: 1400px; }
        .panel { background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .game-area { display: flex; gap: 10px; align-items: flex-start; justify-content: center; }
        
        /* Réserves en U */
        .reserve-container { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        
        .storage-slot { width: 35px; height: 35px; border: 1px solid #555; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: default; background: #222; }
        .zone-blue .storage-slot { border-color: #007bff; }
        .zone-green .storage-slot { border-color: #28a745; }
        
        .chessboard { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); border: 10px solid #444; }
        .square { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 40px; cursor: pointer; user-select: none; position: relative; }
        .white { background-color: #f0d9b5; color: black; }
        .black { background-color: #b58863; color: black; }
        
        .highlight { box-shadow: inset 0 0 0 4px rgba(255, 255, 0, 0.8); }
        .last-move { background-color: rgba(155, 255, 0, 0.5) !important; }
        .possible-move::after { content: ''; width: 15px; height: 15px; background: rgba(0,0,0,0.3); border-radius: 50%; }

        .clock-container { display: flex; gap: 20px; margin-bottom: 10px; width: 100%; justify-content: center; }
        .clock { background: #000; color: #f00; font-family: 'Courier New', monospace; font-size: 2em; padding: 10px 20px; border-radius: 5px; border: 2px solid #555; width: 140px; text-align: center; }
        .clock.active { border-color: #fff; box-shadow: 0 0 10px #fff; background: #220000; }
        .clock-label { font-size: 0.8em; color: #aaa; text-align: center; margin-bottom: 5px; }

        .controls { display: flex; flex-direction: column; gap: 10px; min-width: 350px; }
        .btn { padding: 15px; font-size: 1.1em; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; font-weight: bold; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #28a745; } .btn-green:hover { background: #218838; }
        .btn-blue { background: #007bff; } .btn-blue:hover { background: #0056b3; }
        .btn-red { background: #dc3545; } .btn-red:hover { background: #c82333; }
        .btn-orange { background: #fd7e14; }

        .settings-box { border-top: 1px solid #555; margin-top: 20px; padding-top: 10px; }
        input[type="range"] { width: 100%; }
        
        .pgn-box { height: 100px; overflow-y: auto; background: #000; color: #0f0; padding: 10px; font-family: monospace; border-radius: 4px; font-size: 0.9em; margin-top: 10px; border: 1px solid #333; white-space: pre-wrap; }
        .gcode-box { height: 200px; overflow-y: auto; background: #111; color: #00bfff; padding: 10px; font-family: monospace; border-radius: 4px; font-size: 0.8em; margin-top: 10px; border: 1px solid #444; }

    </style>
</head>
<body>

    <!-- HEADER -->
    <div style="width:100%; padding: 10px 40px; background: #111; display:flex; justify-content:space-between; align-items:center;">
        <h2>♟️ Robot Échecs - Seconde SI</h2>
        <div><a href="/settings" class="btn btn-blue" style="padding: 5px 15px; text-decoration: none; font-size: 0.9em;">⚙️ Réglages</a></div>
    </div>

    <div class="main-container">
        
        <div class="board-container panel">
            <div class="clock-container">
                <div><div class="clock-label">ROBOT (NOIRS)</div><div id="clock-black" class="clock">10:00</div></div>
                <div><div class="clock-label">JOUEUR (BLANCS)</div><div id="clock-white" class="clock active">10:00</div></div>
            </div>
            
            <div class="game-area">
                <!-- Réserve Noire (Gauche/Bleue) -->
                <div class="reserve-container zone-blue" id="res-black-container">
                    <div style="text-align:center; font-size:0.8em; color:#88ccff;">Z. NOIRE</div>
                    <!-- Généré par JS -->
                </div>

                <div id="board" class="chessboard"></div>

                <!-- Réserve Blanche (Droite/Verte) -->
                <div class="reserve-container zone-green" id="res-white-container">
                    <div style="text-align:center; font-size:0.8em; color:#88ff88;">Z. BLANCHE</div>
                    <!-- Généré par JS -->
                </div>
            </div>
        </div>

        <div class="panel controls">
            <h3>Contrôles</h3>
            <button id="btn-validate" class="btn btn-green" onclick="validateMove()">✅ VALIDER FIN DE TOUR</button>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-orange" style="flex:1" onclick="undoMove()">↩️ Annuler</button>
                <button class="btn btn-red" style="flex:1" onclick="resetGame()">♻️ Reset</button>
            </div>

            <div class="pgn-box" id="pgn-display">1. ...</div>
            <div class="gcode-box" id="gcode-display">-- Simulation Mouvements --</div>

            <div class="settings-box">
                <label>ELO: <span id="elo-val">500</span></label>
                <input type="range" id="elo-range" min="100" max="2800" step="50" value="500" onchange="setElo(this.value)">
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <input type="number" id="time-set" value="10" style="width:60px; padding:5px;">
                    <button class="btn-blue" style="padding:5px 10px;" onclick="resetClock()">Set Time</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PIECES = { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔' };
        
        let selectedSquare = null;
        let legalMoves = [];
        let turn = 'white';
        let pendingMove = null;
        let timeWhite = 600, timeBlack = 600, timerInterval = null;

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const files = 'abcdefgh';
            for (let r = 8; r >= 1; r--) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    const sqName = files[c] + r;
                    sq.className = `square ${(r+c)%2!==0 ? 'white' : 'black'}`;
                    sq.id = sqName;
                    sq.onclick = () => onSquareClick(sqName);
                    boardEl.appendChild(sq);
                }
            }
            
            // Initialisation des réserves (U-Shape Visuel)
            const rb = document.getElementById('res-black-container');
            const rw = document.getElementById('res-white-container');
            
            // On crée 18 slots pour être sûr
            for(let i=0; i<18; i++) {
                let d1 = document.createElement('div'); d1.className='storage-slot'; d1.id='rb-'+i; rb.appendChild(d1);
                let d2 = document.createElement('div'); d2.className='storage-slot'; d2.id='rw-'+i; rw.appendChild(d2);
            }

            updateStatus();
            startClock();
        }

        function renderPieces(fen) {
            document.querySelectorAll('.square').forEach(sq => { sq.innerText = ''; sq.classList.remove('last-move'); });
            const rows = fen.split(' ')[0].split('/');
            const files = 'abcdefgh';
            rows.forEach((row, rIdx) => {
                let cIdx = 0;
                for (const char of row) {
                    if (isNaN(char)) {
                        const sq = document.getElementById(files[cIdx] + (8 - rIdx));
                        if(sq) sq.innerText = PIECES[char];
                        cIdx++;
                    } else cIdx += parseInt(char);
                }
            });
        }
        
        function highlightLastMove(uci) {
            document.querySelectorAll('.square').forEach(s => s.classList.remove('last-move'));
            if (!uci) return;
            document.getElementById(uci.substring(0,2))?.classList.add('last-move');
            document.getElementById(uci.substring(2,4))?.classList.add('last-move');
        }

        function updateReserves(caps) {
            for(let i=0; i<18; i++) {
                document.getElementById('rb-'+i).innerText = caps['w'][i] || '';
                document.getElementById('rw-'+i).innerText = caps['b'][i] || '';
            }
        }

        function onSquareClick(sq) {
            if (pendingMove) return; 
            if (selectedSquare === sq) { clearHighlights(); selectedSquare = null; return; }
            const move = selectedSquare + sq;
            if (selectedSquare && legalMoves.includes(move)) { makeProvisionalMove(move); return; }
            clearHighlights();
            selectedSquare = sq;
            document.getElementById(sq).classList.add('highlight');
            legalMoves.forEach(m => { if (m.startsWith(sq)) document.getElementById(m.substring(2, 4)).classList.add('possible-move'); });
        }

        function makeProvisionalMove(uci) {
            pendingMove = uci;
            fetch('/api/move', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uci: uci})})
            .then(r => r.json()).then(data => {
                if (data.status === 'ok') {
                    renderPieces(data.fen);
                    highlightLastMove(uci);
                    const btn = document.getElementById('btn-validate');
                    btn.innerText = "✅ VALIDER " + uci;
                    btn.disabled = false;
                }
            });
        }

        function validateMove() {
            if (!pendingMove) return;
            document.getElementById('btn-validate').disabled = true;
            document.getElementById('btn-validate').innerText = "⏳ IA...";
            timeWhite += 5;
            fetch('/api/bot_move', {method: 'POST'}).then(r => r.json()).then(d => {
                pendingMove = null;
                document.getElementById('btn-validate').innerText = "✅ VALIDER FIN DE TOUR";
                timeBlack += 5;
                updateStatus();
            }).catch(e => alert("Erreur IA: " + e));
        }

        function undoMove() {
            if(pendingMove) { pendingMove = null; document.getElementById('btn-validate').disabled=true; document.getElementById('btn-validate').innerText="✅ VALIDER"; updateStatus(); }
            else { fetch('/api/undo', {method: 'POST'}).then(updateStatus); }
        }

        function resetGame() { if(confirm("Reset ?")) fetch('/api/reset', {method: 'POST'}).then(() => { resetClock(); updateStatus(); }); }

        function updateStatus() {
            fetch('/api/status').then(r => r.json()).then(d => {
                renderPieces(d.fen);
                updateReserves({'w': d.captured_w, 'b': d.captured_b});
                legalMoves = d.legal_moves;
                turn = d.turn;
                if(d.last_move) highlightLastMove(d.last_move);
                document.getElementById('pgn-display').innerText = d.pgn;
                const logs = d.gcode_logs || [];
                document.getElementById('gcode-display').innerText = logs.join('\n');
                document.getElementById('gcode-display').scrollTop = document.getElementById('gcode-display').scrollHeight;
                document.getElementById('clock-white').classList.toggle('active', turn === 'white');
                document.getElementById('clock-black').classList.toggle('active', turn === 'black');
                if (d.is_game_over) { stopClock(); alert("FIN: " + d.result); }
            });
        }

        function startClock() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (turn === 'white' && !pendingMove) timeWhite--;
                if (turn === 'black') timeBlack--;
                updateClockDisplay();
            }, 1000);
        }
        function stopClock() { if (timerInterval) clearInterval(timerInterval); }
        function resetClock() {
            const min = parseInt(document.getElementById('time-set').value);
            timeWhite = min * 60; timeBlack = min * 60;
            updateClockDisplay();
        }
        function updateClockDisplay() {
            const fmt = t => `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`;
            document.getElementById('clock-white').innerText = fmt(timeWhite);
            document.getElementById('clock-black').innerText = fmt(timeBlack);
        }
        function setElo(val) {
            document.getElementById('elo-val').innerText = val;
            fetch('/api/set_elo', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({elo: val})});
        }
        function clearHighlights() { document.querySelectorAll('.square').forEach(s => s.classList.remove('highlight', 'possible-move')); }

        initBoard();
        document.getElementById('btn-validate').disabled = true;
        setInterval(updateStatus, 2000);

    // ─── Rechargement automatique après une mise à jour du serveur ────────────
(function () {
    let v0 = null;
    setInterval(() => {
        fetch('/api/version').then(r => r.json()).then(d => {
            if (v0 === null) v0 = d.version;
            else if (d.version !== v0) location.reload();
        }).catch(() => {});
    }, 5000);
})();
</script>
</body>
</html>
